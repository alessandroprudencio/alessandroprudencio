name: Metrics
on:
  # Roda automaticamente a cada 12 horas
  schedule: [{cron: "0 */12 * * *"}]
  # Permite que você execute manualmente pela aba Actions do GitHub
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Real-time metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # Sem o cabeçalho padrão (seguidores, sponsors, releases)
          base: ""
          config_display: large
          config_timezone: America/Campo_Grande
          # Calendário de contribuições do último ano
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Linguagens mais usadas
          plugin_languages: yes
          plugin_languages_ignored: html, css, handlebars, ejs, mustache, shell, dockerfile
          plugin_languages_details: percentage
          plugin_languages_limit: 6
